// Apex settings example. Adapted in part from Downie2k's configuration.
// See README.md#third-party and README.md#sources.
// Install: <Apex install>/cfg/autoexec.cfg
// Launch: +exec autoexec.cfg
// Current-client support and performance must be checked in game.

// OPTIONAL startup file: support on the current client is unverified.
// See README.md#autoexec-status for the check and removal instructions.
// ADS DoF is now handled in the profile.cfg merge fragment, not here.

// Stable viewing preferences; also available in the game menus.
fov_disableAbilityScaling "1"
sprint_view_shake_style "1"

// OPTIONAL FPS LIMIT: choose a sustainable target in README.md#nvidia.
// Uncomment and replace 141 with YOUR target; 141 is only a 144 Hz example.
// fps_max "141"
// Keep the cap in one place: do not also set +fps_max in launch options.

// OPTIONAL legacy experiment. Off by default; not an ADS DoF equivalent.
// Depth feathering affects blending at intersections for effects/particles.
// mat_depthfeather_enable "0"
