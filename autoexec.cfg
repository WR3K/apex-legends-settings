// Apex settings example. Adapted in part from Downie2k's configuration.
// Credits and license: README.md#references and README.md#third-party.
// Put this in: <Apex install>/cfg/autoexec.cfg
// To try loading it at startup: +exec autoexec.cfg
// Startup support still needs an in-game check. See README.md#autoexec-status.
// This file is optional. The active settings below are also in the game menu.
// The ADS blur setting is in the separate profile.cfg snippet.

// Keep the view steadier during abilities and sprinting.
fov_disableAbilityScaling "1"
sprint_view_shake_style "1"

// Optional FPS cap. Pick a value your PC can hold: README.md#nvidia.
// 141 is just an example for a 144 Hz display, not a cap everyone should use.
// Remove the // below only if you want to set your cap in this file.
// fps_max "141"
// If you already use +fps_max in Steam/EA launch options, leave this commented.

// Older optional experiment: leave commented unless testing it separately.
// This changes blending at particle/effect edges, not the ADS blur setting.
// mat_depthfeather_enable "0"
